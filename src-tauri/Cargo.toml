[package]
name = "calendar-memo"
version = "0.1.0"
description = "轻量化 Windows 日历备忘录"
authors = ["Calendar Memo"]
edition = "2021"

[lib]
name = "calendar_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
